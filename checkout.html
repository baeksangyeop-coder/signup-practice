<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>주문서</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="product.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Practice Store</a>
    <nav class="account" id="account" aria-live="polite"></nav>
  </header>

  <main class="page checkout">
    <a class="back-link" id="back-link" href="index.html">상품으로 돌아가기</a>
    <h1>주문서</h1>

    <p class="notice-line" id="status" aria-live="polite">주문 정보를 불러오는 중…</p>

    <div class="checkout-grid" id="checkout" hidden>
      <!-- 왼쪽: 구매자 정보와 동의 -->
      <section class="checkout-form">
        <h2>구매자 정보</h2>
        <dl class="buyer">
          <dt>이름</dt><dd id="buyer-name"></dd>
          <dt>이메일</dt><dd id="buyer-email"></dd>
        </dl>
        <p class="hint-line">다운로드 링크와 영수증이 이 이메일로 발송돼요. 디지털 상품이라 배송 정보는 필요 없어요.</p>

        <h2>구매 조건</h2>
        <label class="agree">
          <input type="checkbox" id="agree" />
          <span>파일을 내려받은 뒤에는 환불이 어렵다는 점을 확인했고, 선택한 라이선스 범위 안에서만 사용하는 데 동의해요.</span>
        </label>
        <p class="error-line" id="agree-error" aria-live="polite"></p>
      </section>

      <!-- 오른쪽: 주문 요약 -->
      <aside class="summary-card">
        <img id="summary-image" class="summary-image" src="" alt="" />
        <p class="summary-product" id="summary-product"></p>
        <p class="summary-license" id="summary-license"></p>

        <div class="total">
          <span>결제 금액</span>
          <strong id="summary-price"></strong>
        </div>

        <button type="button" class="buy-btn" id="order-btn">주문하기</button>
        <p class="error-line" id="order-error" aria-live="polite"></p>
      </aside>
    </div>

    <!-- 주문이 만들어진 뒤: 토스 결제 화면 -->
    <section class="pay-step" id="pay-step" hidden>
      <h2>결제하기</h2>
      <dl class="buyer">
        <dt>주문번호</dt><dd id="pay-order-id"></dd>
        <dt>상품</dt><dd id="pay-order-name"></dd>
        <dt>결제 금액</dt><dd id="pay-amount"></dd>
      </dl>
      <p class="hint-line">이 금액은 서버가 가격표를 보고 정한 거예요. 테스트 결제라 실제로 돈이 나가지 않아요.</p>

      <!-- 토스가 결제수단 선택 화면과 약관을 이 두 칸에 그려줘요 -->
      <div id="payment-method" class="toss-area"></div>
      <div id="agreement" class="toss-area"></div>

      <button type="button" class="buy-btn" id="pay-btn" disabled>결제하기</button>
      <p class="error-line" id="pay-error" aria-live="polite"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 토스페이먼츠 결제 도구 (버전 2) -->
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <script src="auth.js"></script>
  <script src="checkout.js"></script>
</body>
</html>
