<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로그인 실습</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="panel">
    <h1>로그인</h1>
    <p class="lead">방금 만든 가상 계정으로 들어가 보세요.</p>

    <div class="notice" id="notice" hidden></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">이메일</label>
        <input id="email" type="email" autocomplete="email" />
        <div class="error" id="email-error"></div>
      </div>

      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" />
        <div class="error" id="password-error"></div>
      </div>

      <button type="submit" id="submit-btn">로그인</button>
    </form>

    <p class="switch">계정이 없나요? <a href="index.html">가입하기</a></p>
  </main>

  <!-- Supabase 도구(라이브러리) 불러오기: auth.js보다 먼저 와야 해요 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const emailInput = document.getElementById("email");
    const pwInput = document.getElementById("password");
    const button = document.getElementById("submit-btn");
    const notice = document.getElementById("notice");

    // 이미 로그인한 상태라면 바로 환영 페이지로 (서버에 물어보고 기다리기)
    currentUser().then((user) => {
      if (user) location.href = "welcome.html";
    });

    // 회원가입 직후 넘어온 경우 안내 문구 보여주기
    if (new URLSearchParams(location.search).get("joined")) {
      notice.textContent = "가입이 완료됐어요. 이제 로그인해 보세요.";
      notice.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim().toLowerCase();
      const pw = pwInput.value;

      setFieldError(emailInput, email ? "" : "이메일을 입력해 주세요.");
      setFieldError(pwInput, pw ? "" : "비밀번호를 입력해 주세요.");
      if (!email || !pw) return;

      setLoading(button, true, "확인하는 중…");
      const result = await logIn(email, pw);
      setLoading(button, false);

      if (!result.ok) {
        notice.textContent = result.message;
        notice.classList.add("is-error");
        notice.hidden = false;
        return;
      }

      location.href = "welcome.html"; // 로그인 성공!
    });
  </script>
</body>
</html>
